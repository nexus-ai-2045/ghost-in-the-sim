name: repository-contract

on:
  pull_request:

permissions:
  contents: read

# 候補head自身が変更できる補助検査。信頼境界は
# repository-contract-trusted.yml のbase側advisory監査が担う。

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Fetch pinned repo-preflight
        run: |
          git clone --no-checkout https://github.com/nexus-ai-2045/repo-preflight.git "$RUNNER_TEMP/repo-preflight"
          git -C "$RUNNER_TEMP/repo-preflight" checkout --detach b63a0afbda4eaa1ca7970355c41bf6fd73a52a32
          test "$(git -C "$RUNNER_TEMP/repo-preflight" rev-parse HEAD)" = "b63a0afbda4eaa1ca7970355c41bf6fd73a52a32"

      - name: Check repository preflight
        run: |
          python "$RUNNER_TEMP/repo-preflight/scripts/readiness_scan.py" \
            --repo . \
            --consistency-base-ref "refs/remotes/origin/${{ github.base_ref }}"

      - name: Check declared repository consistency
        run: |
          python "$RUNNER_TEMP/repo-preflight/scripts/consistency_gate.py" \
            --repo . \
            --base-ref "refs/remotes/origin/${{ github.base_ref }}" \
            --require-config \
            --json

      - name: Install pinned ai-ratchet-gate wheel
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/ai_ratchet_gate-0.1.1-py3-none-any.whl \
            https://github.com/nexus-ai-2045/ai-ratchet-gate/releases/download/v0.1.1/ai_ratchet_gate-0.1.1-py3-none-any.whl
          echo "b3f22ab772699d57906326e42189e0ab7a0ee9e33dcad55a90909ece35106cd7  /tmp/ai_ratchet_gate-0.1.1-py3-none-any.whl" | sha256sum --check --strict
          python -m pip install --disable-pip-version-check --no-deps /tmp/ai_ratchet_gate-0.1.1-py3-none-any.whl

      - name: Check tracked-and-ignored ratchet
        run: ai-ratchet-gate --repo .

      - name: Check repository gate distribution
        run: python tests/check_repository_gates.py
